<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validando formularios</title>
    <link rel="stylesheet" href="style_formulario.css">
</head>
<body>
    <div class="contenedor">
        <h2>Formulario de registro</h2>

        <form id="formRegistro" action="registrar.php" novalidate>
            <div class="grupo">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre">
                <div id="errorNombre"></div>
            </div>

            <div class="grupo">
                <label for="correo">Correo Electrónico</label>
                <input type="text" id="correo" name="correo">
                <div id="errorCorreo"></div>
            </div>

            <div class="grupo">
                <label for="edad">Edad</label>
                <input type="text" id="edad" name="edad">
                <div id="errorEdad"></div>
            </div>

            <div class="grupo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password">
                <div id="errorPassword"></div>
            </div>

            <div class="grupo">
                <label for="confirmar">Confirmar Contraseña</label>
                <input type="password" id="confirmar" name="confirmar">
                <div id="errorConfirmar"></div>
            </div>

            <button type="submit">Registrar</button>
        </form>

        <div id="mensajeGeneral"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
